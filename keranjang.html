<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Keranjang Belanja - DRC Racing Exhaust</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-logo">
      <a href="/index.html"><img src="/logo-drc.png" alt="DRC Victory" height="40"/></a>
    </div>
    <ul class="nav-menu">
      <li><a href="/index.html">Lanjut Belanja</a></li>
    </ul>
    <div class="nav-cart">
        <a href="/keranjang.html" class="cart-button">
            <i class="fas fa-shopping-cart"></i>
            <span id="cart-count" class="cart-count-badge">0</span>
        </a>
    </div>
  </nav>

  <section class="page-section">
    <h2 class="section-title">Keranjang Belanja Anda</h2>
    <div class="cart-container">
        <div id="cart-items-container">
            </div>
        <div id="cart-summary" style="display:none;">
            <div class="keranjang-total">
                <span>Total Harga:</span>
                <strong id="cart-total-price">Rp0</strong>
            </div>
            <div class="cart-actions">
                <a href="/index.html" class="btn-secondary">Kembali Belanja</a>
                <a href="/checkout.html" class="hero-btn">Lanjutkan ke Pembayaran</a>
            </div>
        </div>
    </div>
  </section>

  <script src="/script.js"></script>
</body>
</html>
