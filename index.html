<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>DRC Racing Exhaust - Produk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-logo">
      <a href="/index.html"><img src="/logo-drc.png" alt="DRC Victory" height="40"/></a>
    </div>
    <ul class="nav-menu">
      <li><a href="#produk">Produk</a></li>
      <li><a href="#tentang">Tentang</a></li>
      <li><a href="#kontak">Kontak</a></li>
    </ul>
    <div class="nav-cart">
        <a href="#" id="cart-icon" class="cart-button">
            <i class="fas fa-shopping-cart"></i>
            <span id="cart-count" class="cart-count-badge">0</span>
        </a>
    </div>
  </nav>

  <section class="hero"></section>

  <section class="produk-highlight-row">
    <div class="highlight-tabs">
        <button class="highlight-tab-btn active" data-tab="NewLaunch">
            <span class="section-kicker">NEW LAUNCHING</span>
            <h2 class="section-title">Terbaru</h2>
        </button>
        <button class="highlight-tab-btn" data-tab="BestSeller">
            <span class="section-kicker">BEST SELLER</span>
            <h2 class="section-title">Terlaris</h2>
        </button>
    </div>
    <div id="NewLaunch" class="highlight-tab-content"><div id="launching-list" class="highlight-list"></div></div>
    <div id="BestSeller" class="highlight-tab-content" style="display: none;"><div id="best-seller-list" class="highlight-list"></div></div>
  </section>

  <section id="produk" class="produk-section">
    <h2 class="section-title">Temukan Koleksi DRC Victory</h2>
    <div class="produk-series-selector">
      <button class="series-btn active" data-series="vespa">Vespa Series</button>
      <button class="series-btn" data-series="matic">Matic Series</button>
      <button class="series-btn" data-series="herex">Herex Series</button>
      <button class="series-btn" data-series="ninja">Ninja Series</button>
    </div>
    <div id="jenis-selector" class="jenis-selector"></div>
    <div id="barang-list" class="produk-list-grid"></div>
  </section>
  
  <section id="tentang" class="tentang-section"></section>
  <footer id="kontak" class="footer"></footer>

  <div id="modal-marketplace" class="modal-beli-bg" style="display:none;">
      <div class="modal-beli-card">
          <button class="modal-close-btn"><i class="fas fa-times"></i></button>
          <h3 id="modal-marketplace-title"></h3>
          <p>Beli melalui marketplace:</p>
          <div id="modal-marketplace-actions" class="modal-beli-actions"></div>
      </div>
  </div>

  <div id="modal-keranjang" class="modal-beli-bg" style="display:none;">
    <div class="modal-beli-card">
        <button class="modal-close-btn"><i class="fas fa-times"></i></button>
        <h3>Keranjang Belanja</h3>
        <div id="cart-items-container"></div>
        <div id="cart-summary" style="display:none;"></div>
    </div>
  </div>

  <script src="/script.js"></script>
</body>
</html>
