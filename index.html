<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>DRC Victory Produk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img src="/logo-drc.png" alt="DRC Victory" style="height:60px;margin:20px;">
    <h1>Daftar Produk DRC Victory</h1>
  </header>
  <section id="produk">
    <div id="barang-list" class="produk-list"></div>
    <div id="produk-loading" style="display:none;">Loading...</div>
  </section>
  <script>
    async function loadPublicBarangList() {
      const loadingEl = document.getElementById('produk-loading');
      if (loadingEl) loadingEl.style.display = 'block';
      try {
        const res = await fetch('/data/barang.json');
        if (!res.ok) throw new Error('Gagal memuat data produk.');
        const result = await res.json();
        showPublicBarangList(result.data || []);
      } catch (err) {
        document.getElementById('barang-list').innerHTML = '<p>Produk tidak dapat dimuat.</p>';
      } finally {
        if (loadingEl) loadingEl.style.display = 'none';
      }
    }

    function showPublicBarangList(barangList) {
      const list = document.getElementById('barang-list');
      if (!list) return;
      list.innerHTML = '';
      if (!barangList.length) {
        list.innerHTML = '<p>Produk tidak ditemukan.</p>';
        return;
      }
      barangList.forEach(barang => {
        const el = document.createElement('div');
        el.className = 'produk-card';
        el.innerHTML = `
          <img src="${barang.foto}" alt="${barang.nama}" style="max-width:100%;border-radius:8px;">
          <h3>${barang.nama}</h3>
          <p>${barang.deskripsi}</p>
          <p><strong>Rp${barang.harga.toLocaleString('id-ID')}</strong></p>
          <a href="${barang.link}" target="_blank">Beli Sekarang</a>
        `;
        list.appendChild(el);
      });
    }
    document.addEventListener('DOMContentLoaded', loadPublicBarangList);
  </script>
</body>
</html>
